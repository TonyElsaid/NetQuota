name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetQuota-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/NetQuota.exe
          generate_release_notes: true
